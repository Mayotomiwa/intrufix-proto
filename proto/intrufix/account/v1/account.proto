syntax = "proto3";

package intrufix.account.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Internal API of intrufix-account, served over gRPC on the private network
// only. It is never exposed through the gateway.
//
// Callers authenticate with their own service token, sent as
// "authorization: Bearer <token>" metadata. Account decides per service which
// methods each caller may use.
//
// Compatibility rules: only add fields and RPCs. Never renumber, retype or
// remove a field; reserve its number instead. `buf breaking` enforces this.

// UserService gives other services read access to users.
// Callers: core, admin.
service UserService {
  // Returns NOT_FOUND if the user doesn't exist.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // Looks up to 100 users in one call. IDs that don't exist are left out of
  // the response, so callers should index the result by ID.
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
}

// ArtisanService gives other services read access to artisans. An artisan is
// a user who has submitted an artisan application; they keep their one user
// ID, and the session's mode says whether they're acting as a customer or an
// artisan.
// Callers: core, admin.
service ArtisanService {
  // Returns NOT_FOUND if the user has no artisan application.
  rpc GetArtisan(GetArtisanRequest) returns (GetArtisanResponse);

  // Lists the artisans customers can hire for a service type: active, not
  // suspended, verified first. At most 50.
  rpc ListArtisans(ListArtisansRequest) returns (ListArtisansResponse);
}

// WithdrawalPinService checks the PIN users approve withdrawals with.
// Callers: core.
service WithdrawalPinService {
  // Checks pin against the user's withdrawal PIN. A wrong PIN counts towards
  // the same lockout as checks from the app. The outcome is in the response;
  // an error status means the PIN couldn't be checked.
  rpc VerifyWithdrawalPin(VerifyWithdrawalPinRequest) returns (VerifyWithdrawalPinResponse);
}

// AdminService covers administrative actions on users.
// Callers: admin only. Send the acting admin's ID as "x-admin-id" metadata;
// account writes it to the audit log.
service AdminService {
  // Blocks new logins and revokes every existing session for the user.
  rpc SuspendUser(SuspendUserRequest) returns (SuspendUserResponse);
  rpc UnsuspendUser(UnsuspendUserRequest) returns (UnsuspendUserResponse);

  // Marks an artisan profile as checked by Intrufix (identity, skills), or
  // removes that mark. Customers see verified artisans first.
  rpc SetArtisanVerified(SetArtisanVerifiedRequest) returns (SetArtisanVerifiedResponse);
}

message User {
  uint64 id = 1;
  string email = 2;
  string phone = 3;
  string first_name = 4;
  string last_name = 5;
  string onboarding_stage = 6;
  bool suspended = 7;
  google.protobuf.Timestamp created_at = 8;
  // Where the user said they are, if the app had a position; both or
  // neither.
  optional double latitude = 9;
  optional double longitude = 10;
}

message Artisan {
  // The artisan's user ID. Same as user_id: a person has one ID.
  uint64 id = 1;
  uint64 user_id = 2;
  // The business name if they gave one, otherwise their full name.
  string display_name = 3;
  string trade = 4;     // not set yet
  string specialty = 5; // not set yet
  string phone = 6;
  string avatar_url = 7; // not set yet
  // Replaced by skill_ids and other_trades.
  repeated string service_types = 8 [deprecated = true];
  // True once the application is approved and the account isn't suspended.
  // Only active artisans can take new requests.
  bool active = 9;
  bool verified = 10;
  // The bio from their application.
  string about = 11;
  int64 from_price = 12; // not set yet
  // When customers can reach them, e.g. "Weekdays · 8:00 AM – 6:00 PM".
  string availability = 13;

  // Skills from the app's trade catalog, as "<category id>.<skill id>",
  // e.g. "power-and-water.electrician".
  repeated string skill_ids = 14;
  // "Other (specify)" answers: category id -> the trade as they typed it.
  map<string, string> other_trades = 15;
  // The application's review status: "pending_review", "approved" or
  // "rejected".
  string application_status = 16;
  string full_name = 17;
  string business_name = 18;
  uint32 years_of_experience = 19;
  // Where they work from, as they gave it, e.g. "Lekki, Lagos".
  string location = 20;
  // More on where, e.g. a landmark; may be empty.
  string location_detail = 21;
  // How far from location they'll travel for a job.
  uint32 coverage_radius_km = 22;
  // The artisan's position from their profile, if the app had one; both or
  // neither.
  optional double latitude = 23;
  optional double longitude = 24;
}

message GetArtisanRequest {
  // The artisan's user ID.
  uint64 artisan_id = 1;
}

message GetArtisanResponse {
  Artisan artisan = 1;
}

message ListArtisansRequest {
  // Required: one of the service types artisans offer, e.g. "Plumbing".
  string service_type = 1;
  // Leave out this user's own profile, so customers never see themselves.
  uint64 exclude_user_id = 2;
}

message ListArtisansResponse {
  repeated Artisan artisans = 1;
}

message GetUserRequest {
  uint64 user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message BatchGetUsersRequest {
  repeated uint64 user_ids = 1;
}

message BatchGetUsersResponse {
  repeated User users = 1;
}

message VerifyWithdrawalPinRequest {
  uint64 user_id = 1;
  string pin = 2;
}

message VerifyWithdrawalPinResponse {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_OK = 1;
    RESULT_INCORRECT = 2;
    // Too many wrong PINs; nothing is checked until retry_after passes.
    RESULT_LOCKED = 3;
    // The user hasn't created a withdrawal PIN.
    RESULT_NOT_SET = 4;
  }
  Result result = 1;
  // With RESULT_INCORRECT: wrong PINs left before it locks.
  uint32 attempts_left = 2;
  // With RESULT_LOCKED: how long until the PIN can be tried again.
  google.protobuf.Duration retry_after = 3;
}

message SuspendUserRequest {
  uint64 user_id = 1;
}

message SuspendUserResponse {}

message UnsuspendUserRequest {
  uint64 user_id = 1;
}

message UnsuspendUserResponse {}

message SetArtisanVerifiedRequest {
  uint64 artisan_id = 1;
  bool verified = 2;
}

message SetArtisanVerifiedResponse {}
